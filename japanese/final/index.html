    <!-- Theme bootstrap (shared key with the Learning Hub) — runs before paint -->
    <script>
        (function () {
            var root = document.documentElement, t;
            try { t = localStorage.getItem('mis-theme'); } catch (e) {}
            if (t !== 'light' && t !== 'dark') {
                t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            root.setAttribute('data-theme', t);
            try {
                var s = JSON.parse(localStorage.getItem('jpfinal:v1') || '{}').settings || {};
                if (s.romaji === false) root.classList.add('hide-romaji');
                if (s.thai === false) root.classList.add('hide-thai');
                if (s.mode === 'exam') root.setAttribute('data-mode', 'exam');
            } catch (e) {}
        })();
    </script>

                    <div class="mode-switch" role="group" aria-label="โหมดการฝึก">
                        <button type="button" data-mode-set="study" aria-pressed="true">
                            <svg class="icon" aria-hidden="true"><use href="#i-book-open"/></svg><span>โหมดเรียน</span>
                        </button>
                        <button type="button" data-mode-set="exam" aria-pressed="false">
                            <svg class="icon" aria-hidden="true"><use href="#i-graduation"/></svg><span>โหมดสอบ</span>
                        </button>
                    </div>
                    <div class="settings-wrap">
                        <button class="icon-btn" type="button" id="settingsBtn" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu" aria-label="ตั้งค่าการแสดงผล">
                            <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
                        </button>
                        <div class="settings-menu" id="settingsMenu" hidden>
                            <p class="sm-title">การแสดงผล</p>

                            <label class="sw"><input type="checkbox" id="setThai"><span class="sw-ui" aria-hidden="true"></span><span>แสดงความหมายภาษาไทย</span></label>
                            <p class="sm-title">ความเร็วเสียง</p>
                            <div class="seg" role="group" aria-label="ความเร็วเสียง">
                                <button type="button" data-rate="1">ปกติ 1.0×</button>
                                <button type="button" data-rate="0.75">ช้า 0.75×</button>
                            </div>
                            <p class="sm-audio" id="audioStatus"></p>
                            <button class="btn btn-ghost btn-sm btn-block" type="button" id="stopAudio">
                                <svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg>หยุดเสียง
                            </button>
                            <hr>
                            <button class="btn btn-danger-ghost btn-sm btn-block" type="button" id="resetAll">
                                <svg class="icon" aria-hidden="true"><use href="#i-rotate"/></svg>รีเซ็ตความคืบหน้าทั้งหมด
                            </button>
                        </div>
                    </div>
                    <button class="icon-btn theme-toggle" type="button" id="themeBtn" aria-label="สลับธีม">
                        <svg class="icon i-sun" aria-hidden="true"><use href="#i-sun"/></svg>
                        <svg class="icon i-moon" aria-hidden="true"><use href="#i-moon"/></svg>
                    </button>

                        <svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>
                    </a>
